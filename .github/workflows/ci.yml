name: TruckWys CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # The app refuses to start without an encryption key outside DEBUG
      # (core/utils/crypto.py, fail closed). CI-only throwaway key: it
      # protects nothing and must never be used anywhere else.
      FIELD_ENCRYPTION_KEY: Nsgc3x4jayZhAYiajbv6PDAuaOrLRyNPAKvqf4SOleM=
      # The accounting rate limiter (core.accounting.ratelimit) is shared
      # Redis state; tests use db 15 of the service below.
      REDIS_URL: redis://localhost:6379/15

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    strategy:
      matrix:
        # 3.12, matching the Dockerfile and local dev. Django 6 requires >=3.12,
        # so testing on 3.11 can't even install requirements.txt.
        python-version: ['3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Django configuration
        run: |
          python manage.py check

      - name: Run migrations check
        run: |
          python manage.py migrate --run-syncdb

      - name: Run tests
        run: |
          python manage.py test --verbosity=2

      - name: Lint with ruff (if available)
        run: |
          pip install ruff || echo "Ruff not available, skipping lint"
          ruff check . || echo "Linting completed with warnings"
        continue-on-error: true

  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install safety
        run: |
          pip install safety

      - name: Check for security vulnerabilities
        run: |
          safety check -r requirements.txt || echo "Security scan completed"
        continue-on-error: true
