name: Deploy TruckWys Backend to AWS EC2

# Manual trigger only, on purpose. This used to fire on every push to main and
# ran `gunicorn config.wsgi:application` against a bare venv — WSGI drops every
# WebSocket (ws/events/), and it bypassed the container stack entirely. Deploys
# now go through docker-compose.prod.yml (see DEPLOY_EC2.md). Switch this back
# to `on: push` only once you've done a few manual deploys and trust it.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/truckwys/backend
            git pull origin main
            # migrate + collectstatic run inside the web container's entrypoint.
            docker compose -f docker-compose.prod.yml up -d --build
            docker compose -f docker-compose.prod.yml ps
